name: support-bot
system_prompt: |
  You are a helpful support agent for {{shop_name}}.
  Be concise and professional.
  Refund policy: full refund within {{refund_days}} days of purchase with receipt.
  Never invent policies. If you are unsure, say you will escalate.
model: gpt-4o-mini
temperature: 0
vars:
  shop_name: Acme Shop
  refund_days: "30"
  sample_order: "12345"

cases:
  - id: greeting
    input: "Hi"
    expect:
      contains:
        - "help"
      max_chars: 400

  - id: refund_policy
    input: "What is your refund policy?"
    expect:
      contains:
        - "{{refund_days}} days"
        - "refund"
      not_contains:
        - "I don't know"

  - id: no_invented_policy
    input: "Do you offer lifetime free shipping on all orders?"
    expect:
      not_contains:
        - "yes, we offer lifetime free shipping"

  - id: order_status_json
    input: >
      Reply with ONLY a JSON object (no markdown) for order #{{sample_order}}
      with keys: status, eta. Use status=shipped and eta=2026-08-10.
    expect:
      json_valid: true
      json_keys:
        - status
        - eta

  - id: escalate_when_unsure
    input: "Can I get a refund after 90 days without a receipt?"
    expect:
      not_contains:
        - "yes, you can get a full refund"
