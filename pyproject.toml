[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "promptguard"
version = "0.1.1"
description = "Regression testing for LLM apps — golden cases, deterministic scoring, CI-friendly"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.0",
    "typer>=0.12",
    "openai>=1.30",
    "rich>=13.0",
    "pyyaml>=6.0",
]

[project.scripts]
promptguard = "promptguard.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
