name: PromptGuard

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt
          pip install -e ".[dev]"

      - name: Unit tests (offline)
        run: pytest -q

      - name: Check API key
        id: key
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "has_key=false" >> "$GITHUB_OUTPUT"
            echo "::notice::OPENAI_API_KEY secret is not set. Skipping live suite run."
          else
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run support-bot suite
        if: steps.key.outputs.has_key == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python -m promptguard run examples/support_bot_suite.yaml \
            --workers 4 \
            --retries 1 \
            --timeout 60 \
            --junit junit-support.xml \
            --report report-support.md

      - name: Upload artifacts
        if: always() && steps.key.outputs.has_key == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: promptguard-reports
          path: |
            junit-*.xml
            report-*.md
